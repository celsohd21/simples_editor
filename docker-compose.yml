version: '3.8'

services:
  # Nginx - Reverse Proxy (porta 80)
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: simples-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - simples-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Frontend - React (sem porta exposta, vai atrás de nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: simples-frontend
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost/api
      - VITE_WS_URL=ws://localhost/ws
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - simples-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Backend - Flask (sem porta exposta, vai atrás de nginx)
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: simples-backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DEBUG=1
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    volumes:
      - ./backend/src:/app/src
    networks:
      - simples-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  simples-network:
    driver: bridge
